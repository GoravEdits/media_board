<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123d32">
  <title>Gorav Edits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="navbar"><div class="container-fluid px-3 px-lg-4">
      <a href="index.html" class="brand-mark"><span class="brand-symbol">✧</span><span>Gorav <em>Edits</em></span></a>
      <div class="ms-auto d-flex align-items-center gap-3"><a href="#gallery" class="nav-link">Explore</a><a href="./sub_scripts/admin.html" class="nav-link">Manage</a></div>
    </div></nav>
  </header>
  <main class="container-fluid gallery-shell px-3 px-lg-4" id="gallery">
    <div class="gallery-intro">
      <div class="eyebrow"><span></span> LOVE KNOWS NO BORDERS</div>
      <h1>Stories beyond <i>boundaries.</i></h1>
      <p>A collection of moments, moods, and connections across cultures.</p>
    </div>
    <section class="gallery-controls" aria-label="Gallery filters and sorting">
      <div class="filter-group" role="group" aria-label="Content rating">
        <span class="control-label">Content</span>
        <button class="filter-chip active" data-filter="safety" data-value="all" aria-pressed="true">All</button>
        <button class="filter-chip" data-filter="safety" data-value="sfw" aria-pressed="false">SFW</button>
        <button class="filter-chip" data-filter="safety" data-value="nsfw" aria-pressed="false">NSFW</button>
      </div>
      <div class="filter-group" role="group" aria-label="Media type">
        <span class="control-label">Type</span>
        <button class="filter-chip active" data-filter="type" data-value="all" aria-pressed="true">All</button>
        <button class="filter-chip" data-filter="type" data-value="image" aria-pressed="false">Images</button>
        <button class="filter-chip" data-filter="type" data-value="video" aria-pressed="false">Videos</button>
      </div>
      <div class="gallery-actions">
        <button class="action-button" id="shuffleButton" type="button" aria-label="Shuffle gallery">⤨ <span>Shuffle</span></button>
        <label class="sort-wrap" for="sortSelect">Sort
          <select id="sortSelect" aria-label="Sort gallery">
            <option value="default">Default</option>
            <option value="name-asc">Name: A–Z</option>
            <option value="name-desc">Name: Z–A</option>
            <option value="newest">Newest filename first</option>
            <option value="oldest">Oldest filename first</option>
          </select>
        </label>
      </div>
    </section>
    <p class="results-count" id="resultsCount" aria-live="polite"></p>
    <section class="masonry-grid" id="mediaGrid" aria-label="Media gallery"></section>
    <p class="empty-state" id="emptyState" hidden>No media matches these filters yet.</p>
  </main>
  <footer class="site-footer"><span class="footer-ornament">❧</span><span>Made with respect, warmth &amp; an open heart.</span><span class="footer-ornament">❧</span></footer>
  <script src="script.js"></script>
  <script src="sub_scripts/app.js"></script>
</body>
</html>
